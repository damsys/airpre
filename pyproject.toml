[project]
name = "airpre"
version = "0.1.0"
description = "地区ごとの気圧アーカイブと静的サイト"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
airpre-fetch = "airpre.fetch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.13"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
